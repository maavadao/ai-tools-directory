name = "53AI Hub-AI门户|AIHub|全员AI工作平台|AI聚合平台"
description = "53AIHub 是一款开源的AI门户。它可以让你快速搭建一个运营级的AI门户，实现对智能体、提示词与AI工具的发布与运营。它支持无缝对接字节扣子、腾讯元器、Dify、FastGPT、RAGFlow、53AI Studio等智能体开发平台，以及阿里百炼、腾讯云智能体开发平台、火山方舟、百度千帆 AppBuild等云计算平台，让开发者和企业能够快速搭建生产运营级的 AI 门户，无需复杂的技术整合流程。即使是没有技术背景的人员，也能轻松参与智能体发布和运营，极大降低了 AI 应用落地的门槛。"
category = "other"
website = "https://hub.53ai.com"
open_source = true
