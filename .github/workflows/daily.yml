name: Find and refresh tools

on:
  schedule:
    - cron: "0 3 * * *"  # before the daily publish, which then lists what this adds
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Find new tools
        # Sources: the project websites in open-source-ai-repos (works from any server), and Product
        # Hunt (needs the PRODUCT_HUNT_TOKEN secret, and Product Hunt blocks GitHub's servers, so it
        # usually adds nothing here). At most 200 a day, most-starred first.
        continue-on-error: true
        env:
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python scripts/discover.py --max-new 200
      - name: Refresh preview images and pricing flags
        # Oldest first, 300 tools a day, each page read politely (robots.txt, one request a second).
        continue-on-error: true
        run: python scripts/enrich.py --limit 300
      - run: python scripts/validate.py
      - name: Commit
        run: |
          git add tools data
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          n=$(git diff --cached --name-only -- tools | wc -l)
          git config user.name "maavadao-bot"
          git config user.email "maavadao-bot@users.noreply.github.com"
          git commit -m "Daily update: $n new tools, refreshed site data"
          # Someone may have pushed while this ran (it takes a few minutes).
          git pull --rebase origin main
          git push
