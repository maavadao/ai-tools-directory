name: Fix a listing
description: A price, category or description is wrong or out of date.
labels: [fix]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong, and what should it say?
      description: Please link the tool's own page that shows the right answer.
    validations:
      required: true
